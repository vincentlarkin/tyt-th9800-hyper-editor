name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test .\tests\TH9800.HyperEditor.Tests\TH9800.HyperEditor.Tests.csproj -c Release
